# CI pipeline for Pahlevani Flutter app.
#
# Jobs on every push/PR to main:
#   test        — format check + analyze + unit/widget tests + coverage gate (≥50%)
#   build       — debug + release APK builds (depends on test)
#   integration — fake-repo integration tests on Linux desktop (depends on test)
#
# NOT in CI:
#   smoke_test.dart — hits real Supabase; run manually:
#     flutter test integration_test/smoke_test.dart -d linux --update-goldens
#
# The APK builds are a compile check, NOT a release artifact: nothing built
# here is distributed. Release builds are made locally (see CLAUDE.md).
#
# GitHub Actions secrets — all OPTIONAL (Settings → Secrets → Actions).
# Without them the APKs build with empty Firebase keys and the committed
# placeholder google-services.json, which is enough to prove compilation.
#   FIREBASE_ANDROID_API_KEY  — Android Firebase API key (dart-define)
#   FIREBASE_IOS_API_KEY      — iOS Firebase API key (dart-define)
#   FIREBASE_WEB_API_KEY      — Web Firebase API key (dart-define)
#   GOOGLE_SERVICES_JSON      — base64-encoded android/app/google-services.json

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── Unit + widget tests ────────────────────────────────────────────────────
  test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (3.29.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (flutter_lints)
        run: flutter analyze

      - name: Guard INTERNET permission in main AndroidManifest
        run: |
          grep -q 'android.permission.INTERNET' \
            android/app/src/main/AndroidManifest.xml || \
            { echo "FAIL: INTERNET permission missing from main AndroidManifest.xml"; exit 1; }

      - name: Run unit + widget tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold (≥50%)
        run: |
          COVERED=$(grep "^DA:" coverage/lcov.info | grep -v ",0$" | wc -l)
          TOTAL=$(grep -c "^DA:" coverage/lcov.info)
          PCT=$((COVERED * 100 / TOTAL))
          echo "Coverage: ${PCT}% (${COVERED}/${TOTAL} lines)"
          if [ "$PCT" -lt 50 ]; then
            echo "FAIL: coverage ${PCT}% is below the 50% threshold."
            exit 1
          fi

  # ── Build (debug + release) ────────────────────────────────────────────────
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (3.29.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      # A placeholder google-services.json is committed. Replace it only when
      # the real one is provided as a secret — decoding an empty secret would
      # leave an empty file and fail processDebugGoogleServices.
      - name: Write google-services.json (if secret set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set — using the committed placeholder."
          fi

      - name: Build Android APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}

      # Release build uses debug signing in CI (key.properties absent).
      # Purpose: catch R8/ProGuard/compilation issues that only appear in release mode.
      - name: Build Android APK (release)
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }} \
            --dart-define=FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY }} \
            --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}

  # ── Integration tests (Linux desktop, fake repos) ─────────────────────────
  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (3.29.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Flutter Linux desktop build dependencies
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse0 \
            xvfb

      - name: Enable Flutter Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # TEMPORARY diagnostic (fix/ci-green): the app exits at startup under xvfb.
      # Report missing shared libs and the binary's own stderr. Remove once green.
      - name: Diagnose Linux app startup (temporary)
        continue-on-error: true
        run: |
          PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig flutter build linux --debug
          B=build/linux/x64/debug/bundle
          echo "== missing libraries"
          for f in $B/pahlevani $B/lib/*.so*; do ldd "$f" | grep "not found" | sed "s|^|$f: |"; done || true
          echo "== app stderr/stdout (15 s under xvfb)"
          timeout 15 xvfb-run --auto-servernum $B/pahlevani 2>&1 | tail -60; echo "exit=${PIPESTATUS[0]}"

      # xvfb-run provides a virtual X11 display so Flutter can open a window.
      # Software Mesa handles GPU rendering on the headless runner.
      # Linux desktop does not use Firebase; no --dart-define needed here.
      - name: Run integration tests (fake-repo journeys)
        run: |
          PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig \
          xvfb-run --auto-servernum \
            flutter test integration_test/app_test.dart -d linux
